name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install verification tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build .

      - name: Run tests
        run: python -m pytest tests -q

      - name: Compile package and standalone skill
        run: python -m compileall -q src skill/altar/scripts

      - name: Build wheel
        run: python -m build --wheel
