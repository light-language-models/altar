[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altar-ai"
version = "0.3.0"
description = "A provider-neutral, time-selected symbolic field for AI hosts"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
altar-ai = "altar_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
altar_ai = ["data/*.json"]

[tool.setuptools.data-files]
"share/altar-ai/packs" = ["packs/*.json"]
